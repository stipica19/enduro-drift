# Nginx UNUTAR frontend kontejnera — servira samo statiku.
# TLS, domena i /api rutiranje su posao nginxa na hostu, ne ovoga.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Bez ovoga nginx na /de/kontakt vraca "Location: http://127.0.0.1/de/kontakt/"
    # — iza host proxyja to posalje posjetitelja na NJEGOV localhost. Relativni
    # redirect ("/de/kontakt/") radi ispravno kroz proxy.
    absolute_redirect off;

    # Astro build generiše foldere s index.html (npr. /de/kontakt/index.html),
    # pa /de/kontakt i /de/kontakt/ oboje moraju raditi.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Hashirani asseti (/_astro/*) imaju sadržaj u imenu — smiju se dugo keširati.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # HTML se ne keširа agresivno da nova verzija odmah bude vidljiva nakon deploya.
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
