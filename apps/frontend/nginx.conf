# Nginx UNUTAR frontend kontejnera — servira samo statiku.
# TLS, domena i /api rutiranje su posao nginxa na hostu, ne ovoga.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vlastita 404 stranica (Astro generiše /404.html). Status ostaje 404, samo je tijelo korisno.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Bez ovoga nginx na /de/kontakt vraca "Location: http://127.0.0.1/de/kontakt/"
    # — iza host proxyja to posalje posjetitelja na NJEGOV localhost. Relativni
    # redirect ("/de/kontakt/") radi ispravno kroz proxy.
    absolute_redirect off;

    # Sajt nema stranicu na "/" (samo /de/... i /en/...), pa se korijen domene vodi na
    # njemački. 301 jer je odredište fiksno i tako link equity s "/" prelazi na /de/.
    # Ako se ikad uvede prepoznavanje jezika po Accept-Language, ovo mora postati 302
    # (browseri 301 keširaju trajno). Završni "/" izbjegava dupli skok /de -> /de/.
    location = / {
        return 301 /de/;
    }

    # Stari sajt je imao EN stranice na njemačkim slugovima (/en/anmeldung, ...), a novi ih ima na
    # engleskim (/en/booking, ...). Stari URL-ovi su u Google indeksu, pa se trajno preusmjeravaju
    # da ranking i backlinkovi ne završe na 404. /en/blog i blog objave su ostali isti.
    location ~ ^/en/anmeldung/?$  { return 301 /en/booking/; }
    location ~ ^/en/galerie/?$    { return 301 /en/gallery/; }
    location ~ ^/en/reisefuhrer/?$ { return 301 /en/team/; }
    location ~ ^/en/gastebuch/?$  { return 301 /en/guestbook/; }
    location ~ ^/en/kontakt/?$    { return 301 /en/contact/; }
    location ~ ^/en/termine/?$    { return 301 /en/dates/; }

    # Slugovi promijenjeni 2026-09-21: tim ima svoj URL umjesto /reisefuhrer (travel guide) i
    # /en/guide, a "Motorräder" se piše s "ae" umjesto izostavljenog umlauta.
    location ~ ^/de/reisefuhrer/?$ { return 301 /de/team/; }
    location ~ ^/en/guide/?$       { return 301 /en/team/; }
    location ~ ^/de/motorrader/?$  { return 301 /de/motorraeder/; }
    location = /sitemap.xml { return 301 /sitemap-index.xml; }

    # /index.html sada vraća 200 kao duplikat; neka vodi na početnu
    location = /index.html { return 301 /de/; }

    # Astro build generiše foldere s index.html (npr. /de/kontakt/index.html),
    # pa /de/kontakt i /de/kontakt/ oboje moraju raditi.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Hashirani asseti (/_astro/*) imaju sadržaj u imenu — smiju se dugo keširati.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # HTML se ne keširа agresivno da nova verzija odmah bude vidljiva nakon deploya.
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml application/xml;
    gzip_min_length 1024;
}
