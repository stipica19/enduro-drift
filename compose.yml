# Produkcijski stack na VPS-u.
# Pokretanje:  docker compose pull && docker compose up -d
#
# TLS, domenu i rutiranje radi nginx NA HOSTU (/etc/nginx/sites-available),
# ne Docker. Zato su portovi vezani na 127.0.0.1 — dostupni su host nginxu,
# ali ne i direktno s interneta.

services:
  frontend:
    image: ghcr.io/${GHCR_OWNER}/enduro-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      # Host port podesiv u .env. Default nije 8080 jer na deljenom VPS-u njega koristi druga app.
      - "127.0.0.1:${FRONTEND_HOST_PORT:-8095}:80"

  backend:
    image: ghcr.io/${GHCR_OWNER}/enduro-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      # Isto (3001 na hostu koristi druga app) — interni port kontejnera (3001) ostaje fiksan,
      # samo host port je podesiv.
      - "127.0.0.1:${BACKEND_HOST_PORT:-3095}:3001"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3001
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 3h
      timeout: 5s
      retries: 3
      start_period: 15s
      start_interval: 5s
